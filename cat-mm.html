<style>
  :root {
    /* DG-1/DG-2: self-contained page (no base.css) — own copy of
       the app's type-identity tokens. */

    --text: #e5e5e5;
    --muted: #6b7280;
    --accent: #6366f1;
    --accent-dim: rgba(99,102,241,0.12);

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-ui); min-height: 100vh; padding-bottom: 60px; }

  .page-wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }

  .back-nav { padding: calc(16px + env(safe-area-inset-top, 0px)) 0 0; }
  /* These four program landing pages don't link base.css, so none of its
     safe-area padding reaches them and this was the page's very first row
     of content at y0. Measured at a 59px inset: the "\u2190 Programs" link
     painted at y19, i.e. entirely behind the status bar. */
  .back-nav a { color: var(--muted); text-decoration: none; font-size: 13px; letter-spacing: 0.02em; }
  .back-nav a:hover { color: var(--accent); }

  .program-header {
    margin-top: 20px;
    padding: 24px 20px;
    background: linear-gradient(135deg, #0d0e2e, #0a0a0a);
    border: 1px solid rgba(99,102,241,0.3);
    border-top: 3px solid var(--accent);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
  }
  .program-header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, transparent 70%);
    pointer-events: none;
  }
  .program-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .program-icon { font-size: 28px; margin-bottom: 10px; display: block; }
  .program-header h1 { font-size: clamp(24px, 5vw, 30px); font-weight: 900; line-height: 1.1; color: #fff; margin-bottom: 10px; letter-spacing: -0.02em; }
  .program-tagline { font-size: 14px; color: var(--muted); line-height: 1.55; margin-bottom: 18px; }
  .program-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .meta-badge { background: var(--accent-dim); border: 1px solid var(--accent-glow); color: var(--accent); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.04em; }
  .designer-credit { font-size: 12px; color: var(--muted); margin-top: 14px; }

  .guide-link {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-dim); border: 1px solid var(--accent-glow);
    color: var(--accent); font-size: 12px; font-weight: 700;
    padding: 9px 16px; border-radius: 8px; text-decoration: none;
    margin-top: 16px; transition: background 0.15s;
  }
  .guide-link:hover { background: rgba(99,102,241,0.2); }

  .section-label { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 28px 0 12px; }

  /* ── Weekly schedule ── */
  .week-overview { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; }
  .week-overview-label { font-size: 10.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .week-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; }
  .week-row:last-child { border-bottom: none; }
  .week-day { font-size: 10.5px; font-weight: 700; color: var(--muted); width: 44px; flex-shrink: 0; letter-spacing: 0.06em; }
  .week-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .week-name { font-weight: 700; color: #e2e8f0; }
  .week-tag { font-size: 10.5px; color: var(--muted); margin-left: auto; letter-spacing: 0.04em; }

  /* ── Phase cards ── */
  .phase-card {
    display: block;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 0;
    text-decoration: none;
    color: var(--text);
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.15s, background 0.15s;
  }
  .phase-card:hover { background: rgba(255,255,255,0.02); }
  .phase-card.p1 { border-left: 4px solid #3b82f6; }
  .phase-card.p2 { border-left: 4px solid #ef4444; }
  .phase-card.p3 { border-left: 4px solid #10b981; }
  .phase-card.p1:hover { border-color: rgba(59,130,246,0.5); }
  .phase-card.p2:hover { border-color: rgba(239,68,68,0.5); }
  .phase-card.p3:hover { border-color: rgba(16,185,129,0.5); }

  .phase-inner { display: flex; align-items: center; gap: 16px; padding: 18px 20px; }
  .phase-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .p1 .phase-icon { background: rgba(59,130,246,0.12); }
  .p2 .phase-icon { background: rgba(239,68,68,0.12); }
  .p3 .phase-icon { background: rgba(16,185,129,0.12); }
  .phase-body { flex: 1; min-width: 0; }
  .phase-eyebrow { font-size: 10.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
  .p1 .phase-eyebrow { color: #60a5fa; }
  .p2 .phase-eyebrow { color: #f87171; }
  .p3 .phase-eyebrow { color: #34d399; }
  .phase-name { font-size: 16px; font-weight: 900; color: #e2e8f0; margin-bottom: 3px; letter-spacing: -0.01em; }
  .phase-desc { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .phase-pills { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 20px 16px; }
  .phase-pill { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; letter-spacing: 0.05em; }
  .p1 .phase-pill { background: rgba(59,130,246,0.1); color: #60a5fa; border: 1px solid rgba(59,130,246,0.2); }
  .p2 .phase-pill { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
  .p3 .phase-pill { background: rgba(16,185,129,0.1); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
  .phase-arrow { font-size: 16px; color: var(--muted); flex-shrink: 0; }

  /* ── Phase divider / progression banner ── */
  .prog-banner {
    background: rgba(99,102,241,0.06);
    border: 1px solid rgba(99,102,241,0.2);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 20px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .prog-banner-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .prog-banner-text { font-size: 12px; color: #a5b4fc; line-height: 1.55; }
  .prog-banner-text strong { color: #c7d2fe; font-weight: 800; }

  /* ── Conditioning card ── */
  .cond-card {
    display: flex; align-items: center; gap: 14px;
    background: rgba(217,119,6,0.06);
    border: 1px solid rgba(217,119,6,0.25);
    border-radius: 14px; padding: 18px 20px;
    text-decoration: none; color: var(--text);
    transition: border-color 0.15s;
  }
  .cond-card:hover { border-color: rgba(217,119,6,0.5); background: rgba(217,119,6,0.1); }
  .cond-icon { width: 48px; height: 48px; border-radius: 12px; background: rgba(217,119,6,0.15); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .cond-body { flex: 1; }
  .cond-title { font-size: 15px; font-weight: 800; color: #fbbf24; margin-bottom: 3px; }
  .cond-desc { font-size: 12px; color: #92400e; }
  .cond-arrow { font-size: 16px; color: #d97706; }

  /* ── SAND LIGHT MODE (Phase 7) ────────────────────────────────────── */
  html[data-theme="light"] {
    --bg: #f5f2ec;
    --surface: #efe9db;
    --border: rgba(28,26,23,0.12);
    --text: #1c1a17;
    --muted: #6b6459;
    --accent-dim: rgba(99,102,241,0.16);
    --accent-glow: rgba(99,102,241,0.32);
  }
  html[data-theme="light"] .program-header { background: linear-gradient(135deg, rgba(99,102,241,0.14), #faf7f0); }
  html[data-theme="light"] .program-header h1,
  html[data-theme="light"] .week-name,
  html[data-theme="light"] .phase-name { color: #1c1a17; }
  html[data-theme="light"] .p1 .phase-eyebrow,
  html[data-theme="light"] .p1 .phase-pill { color: #1d4ed8; }
  html[data-theme="light"] .p2 .phase-eyebrow,
  html[data-theme="light"] .p2 .phase-pill { color: #b91c1c; }
  html[data-theme="light"] .p3 .phase-eyebrow,
  html[data-theme="light"] .p3 .phase-pill { color: #047857; }
  html[data-theme="light"] .prog-banner-text { color: #4338ca; }
  html[data-theme="light"] .prog-banner-text strong { color: #312e81; }
  html[data-theme="light"] .cond-title { color: #92400e; }
