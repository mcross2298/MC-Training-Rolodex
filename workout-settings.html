/* Workout Settings — the owner's reference screen (2026-10-25): back arrow,
   display title, grouped cards of switches, Cancel / Save changes pinned to
   the bottom. Changes are STAGED: nothing is written until Save changes.
   No bottom nav (mc-nav.js is not loaded): this is a form with its own exit,
   and a fifth-tab bar under Cancel / Save would be two competing footers.
   The header is deliberately NOT a sticky .topbar — it scrolls away with the
   page, so check-topbar-inset.js's sticky-bar contract does not apply. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--ws-card:var(--card-bg);--ws-off:var(--ink-4);--ws-edge:var(--ink-6);--ws-knob:var(--ink-11);}
html[data-theme="light"]{--ws-card:var(--ink-11);--ws-off:var(--ink-8);--ws-edge:var(--ink-6);--ws-knob:var(--ink-11);}
html[data-theme="light"] .ws-save{color:var(--ink-11);}
body{background:var(--body-bg);color:var(--text);font-family:var(--font-ui);min-height:100vh;
  padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));}
.ws-wrap{max-width:560px;margin:0 auto;}
.ws-back{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;margin-left:-12px;
  border-radius:var(--r-md);color:var(--text);text-decoration:none;}
.ws-back svg{width:24px;height:24px;}
.ws-title{font-family:var(--font-display,inherit);font-size:var(--fs-hero);font-weight:var(--fw-black);letter-spacing:-0.02em;margin:8px 0 24px;}
.ws-group{margin-bottom:28px;}
.ws-label{font-size:var(--fs-sm);font-weight:var(--fw-bold);letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px 2px;}
.ws-card{background:var(--ws-card);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:0 16px;}
.ws-row{display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:14px 0;background:none;border:none;
  border-bottom:1px solid var(--hairline);color:inherit;font:inherit;text-align:left;cursor:pointer;}
.ws-row:last-child{border-bottom:none;}
.ws-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm);}
.ws-text{flex:1;min-width:0;}
.ws-name{display:block;font-size:var(--fs-xl);font-weight:var(--fw-semi);}
.ws-sub{display:block;font-size:var(--fs-sm);font-weight:var(--fw-regular);color:var(--muted);margin-top:3px;line-height:1.4;}
/* the switch: 52x32, the row around it is the 48px+ target */
.ws-switch{position:relative;flex-shrink:0;width:52px;height:32px;border-radius:16px;background:var(--ws-off);box-shadow:inset 0 0 0 1px var(--ws-edge);transition:background .18s ease;}
.ws-switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--ws-knob);
  box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .18s ease;}
.ws-row[aria-checked="true"] .ws-switch{background:var(--accent);box-shadow:none;}
.ws-row[aria-checked="true"] .ws-switch::after{transform:translateX(20px);}
@media (prefers-reduced-motion:reduce){.ws-switch,.ws-switch::after{transition:none;}}
.ws-chev{flex-shrink:0;font-size:var(--fs-xl);color:var(--muted);}
.ws-note{font-size:var(--fs-sm);color:var(--muted);line-height:1.5;margin:-14px 2px 28px;}
.ws-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:12px;background:var(--body-bg);
  border-top:1px solid var(--hairline);
  padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));}
.ws-bar-in{display:flex;gap:12px;width:100%;max-width:560px;margin:0 auto;}
.ws-btn{flex:1;min-height:56px;border-radius:var(--r-md);font:inherit;font-size:var(--fs-xl);font-weight:var(--fw-bold);cursor:pointer;border:1px solid var(--hairline);}
.ws-cancel{background:var(--ws-card);color:var(--text);}
.ws-save{background:var(--accent);color:var(--ink-0);border-color:transparent;}
.ws-save:disabled{background:var(--ws-off);color:var(--muted);cursor:default;}
.ws-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.ws-toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;
  background:var(--text);color:var(--body-bg);font-size:var(--fs-md);font-weight:var(--fw-bold);padding:10px 16px;border-radius:var(--r-md);

<script>
/* Every switch writes one key of mc_prefs_v1 — the store mc-timer.js's
   MC_PREFS.get() reads on every workout page. The defaults below MUST match
   MC_PREFS.get(): a key that was never saved reads as its default there, so a
   different default here would show the athlete a switch position the
   workout page does not obey. */
(function () {
  var GROUPS = [
    { label: 'Rest timer', rows: [
      { k: 'autoRest', dflt: true, name: 'Start rest after logging', sub: 'Tick a set and the rest countdown starts. Off: tap the rest timer yourself.' },
      { k: 'sound', dflt: true, name: 'Rest countdown sounds', sub: 'A tone as rest ends. On silent, the screen flashes green at 0 instead.' },
      { k: 'cue10s', dflt: true, name: '10-second warning', sub: 'A short cue 10 seconds before rest ends.' },
      { k: 'haptics', dflt: true, name: 'Vibrate when rest ends', sub: 'Android only — iPhone does not let web apps vibrate.' }
    ]},
    { label: 'Navigation', rows: [
      { k: 'autoMoveLog', dflt: true, name: 'Auto move after logging', sub: 'Finish an exercise and the next one opens.' },
      { k: 'autoMoveRest', dflt: false, name: 'Auto move after rest', sub: 'When rest reaches 0, jump to your next set.' }
    ]},
    { label: 'Display', rows: [
      { k: 'showMax', dflt: false, name: 'Show max weight logged', sub: 'Your heaviest logged weight on each exercise, next to Last.' },
      { k: 'keepAwake', dflt: true, name: 'Keep screen on during workouts', sub: 'From your first set until you finish. Off: only while a rest counts down.' }
    ]}
  ];
  var KEY = 'mc_prefs_v1';

  function readStore() {
    try { var p = JSON.parse(localStorage.getItem(KEY) || '{}'); return (p && typeof p === 'object' && !Array.isArray(p)) ? p : {}; }
    catch (e) { return {}; }
  }
  function valueOf(p, r) { return p[r.k] === undefined ? r.dflt : p[r.k] === true; }

  var saved = {}, draft = {};
  var stored = readStore();
  GROUPS.forEach(function (g) { g.rows.forEach(function (r) { saved[r.k] = draft[r.k] = valueOf(stored, r); }); });

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var form = document.getElementById('wsForm');
  form.innerHTML = GROUPS.map(function (g, gi) {
    return '<section class="ws-group" aria-labelledby="wsg' + gi + '">' +
      '<h2 class="ws-label" id="wsg' + gi + '">' + esc(g.label) + '</h2><div class="ws-card">' +
      g.rows.map(function (r) {
        return '<button type="button" class="ws-row" role="switch" id="ws-' + r.k + '" data-k="' + r.k + '" aria-checked="' + draft[r.k] + '">' +
          '<span class="ws-text"><span class="ws-name">' + esc(r.name) + '</span><span class="ws-sub">' + esc(r.sub) + '</span></span>' +
          '<span class="ws-switch" aria-hidden="true"></span></button>';
      }).join('') + '</div></section>';
  }).join('');

  var saveBtn = document.getElementById('wsSave');
  function dirtyKeys() { return Object.keys(draft).filter(function (k) { return draft[k] !== saved[k]; }); }
  function refresh() { saveBtn.disabled = dirtyKeys().length === 0; }

  form.addEventListener('click', function (e) {
    var row = e.target.closest('.ws-row');
    if (!row) return;
    var k = row.dataset.k;
    draft[k] = !draft[k];
    row.setAttribute('aria-checked', String(draft[k]));
    refresh();
  });

  // Where Back goes: the page that opened this one when it is ours (the
  // account sheet on Home, or the rest row mid-workout), so a mid-session
  // visit returns to the session; Home otherwise.
  function leave() {
    var ref = null;
    try { ref = document.referrer ? new URL(document.referrer) : null; } catch (e) {}
    if (ref && ref.origin === location.origin && history.length > 1) history.back();
    else location.href = 'dashboard.html';
  }
  function confirmDiscard() {
    if (!dirtyKeys().length) return Promise.resolve(true);
    return window.MC_SHEET && MC_SHEET.confirm
      ? MC_SHEET.confirm('Discard your changes?', { ok: 'Discard', cancel: 'Keep editing', danger: true })
      : Promise.resolve(true);
  }
  function cancel(e) {
    if (e) e.preventDefault();
    confirmDiscard().then(function (yes) { if (yes) leave(); });
  }
  document.getElementById('wsCancel').addEventListener('click', cancel);
  document.getElementById('wsBack').addEventListener('click', cancel);

  document.getElementById('wsReport').addEventListener('click', function () {
    if (window.MC_REPORT) MC_REPORT.open();
  });

  var toast = document.getElementById('wsToast');
  function say(msg) {
    toast.textContent = msg; toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 3200);
  }

  // Notifications: not staged with the switches above. The permission prompt
  // has to come from the tap itself, so this acts immediately.
  var pushRow = document.getElementById('wsPush');
  var pushSub = document.getElementById('wsPushSub');
  var PUSH_DEFAULT_SUB = pushSub.textContent;
  var pushBusy = false;
  function standalone() {
    try { return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; }
  }
  function paintPush(on, sub) {
    pushRow.setAttribute('aria-checked', String(!!on));
    pushSub.textContent = sub || PUSH_DEFAULT_SUB;
  }
  function pushStatus() {
    var P = window.MC_PUSH;
    if (!P || !P.isSupported()) {
      var ios = /iPhone|iPad|iPod/.test(navigator.userAgent || '') && !standalone();
      return paintPush(false, ios ? 'On iPhone, add this app to your Home Screen and open it from there first.'
                                  : 'This browser does not support notifications.');
    }
    if (P.getState() === 'denied') return paintPush(false, 'Blocked in your phone\u2019s settings. Allow notifications for this app there, then come back.');
    P.isSubscribed().then(function (yes) { paintPush(yes && P.getState() === 'granted'); }, function () { paintPush(false); });
  }
  pushStatus();
  pushRow.addEventListener('click', function () {
    var P = window.MC_PUSH;
    if (pushBusy || !P || !P.isSupported() || P.getState() === 'denied') { pushStatus(); return; }
    pushBusy = true;
    var turningOn = pushRow.getAttribute('aria-checked') !== 'true';
    var job = turningOn ? P.enable() : P.unsubscribe().then(function () { return { ok: true }; });
    job.then(function (r) {
      pushBusy = false;
      try { localStorage.setItem('mc_push_asked_v1', String(Date.now())); } catch (e) {}
      if (!turningOn) { paintPush(false); say('Notifications off'); return; }
      if (r && r.ok) { paintPush(true); say('Notifications on'); return; }
      var why = r && r.reason;
      if (why === 'signed-out') { paintPush(true, 'On for this phone, but sign in so the weekly check-in can reach it.'); return; }
      pushStatus();
      say(why === 'denied' ? 'Notifications are blocked for this app' : why === 'dismissed' ? 'Not turned on' : 'Could not turn on notifications. Try again.');
    }, function () { pushBusy = false; pushStatus(); say('Could not change notifications. Try again.'); });
  });

  saveBtn.addEventListener('click', function () {
    var changed = dirtyKeys();
    if (!changed.length) return;
    // Re-read the store at save time and merge only the changed keys, so a
    // key another tab or the rest row's own pills wrote meanwhile survives.
    var p = readStore();
    changed.forEach(function (k) { p[k] = draft[k]; });
    try { localStorage.setItem(KEY, JSON.stringify(p)); }
    catch (err) {
      toast.textContent = 'Could not save — this device is out of storage.';
      toast.classList.add('show'); setTimeout(function () { toast.classList.remove('show'); }, 3000);
      return;
    }
    changed.forEach(function (k) {
      saved[k] = draft[k];
      try { document.dispatchEvent(new CustomEvent('mc:prefs-changed', { detail: { key: k, value: draft[k] } })); } catch (e) {}
    });
    refresh();
    toast.textContent = 'Saved';
    toast.classList.add('show');
    setTimeout(leave, 700);
  });
})();
</script>
