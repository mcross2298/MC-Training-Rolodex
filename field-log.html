<style>
/* Field log — field-feedback-roadmap.md FB6. Admins only: every problem
   report and crash type, newest first, filterable by status. READ-ONLY on
   purpose: status is changed on GitHub (close the issue, or add the
   in-progress / needs-decision label), so there is one source of truth and
   this page can never disagree with the issue it links to.
   The athlete's own words appear here and nowhere public: the phase-15
   policy lets an admin read them, and GitHub issues never carry them. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--body-bg);color:var(--text);font-family:var(--font-ui);min-height:100vh;
  padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));}
.fl-wrap{max-width:640px;margin:0 auto;}
.fl-back{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;margin-left:-12px;border-radius:var(--r-md);color:var(--text);text-decoration:none;}
.fl-back svg{width:24px;height:24px;}
.fl-title{font-family:var(--font-display,inherit);font-size:var(--fs-hero);font-weight:var(--fw-black);letter-spacing:-0.02em;margin:8px 0 6px;}
.fl-sub{font-size:var(--fs-md);color:var(--muted);line-height:1.5;margin-bottom:18px;}
.fl-sub a{color:var(--text);}
.fl-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.fl-count{background:var(--card-bg);border:1px solid var(--hairline);border-radius:var(--r-md);padding:10px 8px;text-align:center;}
.fl-count b{display:block;font-size:var(--fs-2xl);font-weight:var(--fw-black);}
.fl-count span{font-size:var(--fs-sm);color:var(--muted);}
.fl-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.fl-chip{flex:0 0 auto;min-height:48px;padding:0 16px;border-radius:24px;border:1px solid var(--hairline);background:transparent;color:var(--text);font:inherit;font-size:var(--fs-md);font-weight:var(--fw-bold);cursor:pointer;}
.fl-chip[aria-pressed="true"]{background:var(--accent);color:var(--ink-0);border-color:transparent;}
.fl-chip:focus-visible,.fl-item summary:focus-visible,.fl-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.fl-list{display:flex;flex-direction:column;gap:8px;}
.fl-item{background:var(--card-bg);border:1px solid var(--hairline);border-radius:var(--r-lg);}
.fl-item summary{list-style:none;cursor:pointer;padding:12px 14px;min-height:48px;}
.fl-item summary::-webkit-details-marker{display:none;}
.fl-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted);}
.fl-kind{font-weight:var(--fw-bold);text-transform:uppercase;letter-spacing:0.06em;}
.fl-pill{font-weight:var(--fw-bold);padding:2px 8px;border-radius:10px;border:1px solid currentColor;}
.st-new,.st-filed{color:var(--muted);}
.st-fixing{color:#60a5fa;}
.st-needs_decision{color:#c4b5fd;}
.st-fixed{color:#34d399;}
.st-wontfix,.st-duplicate{color:var(--muted);}
html[data-theme="light"] .st-fixing{color:#1d4ed8;}
html[data-theme="light"] .st-needs_decision{color:#6d28d9;}
html[data-theme="light"] .st-fixed{color:#047857;}
.fl-what{font-size:var(--fs-lg);font-weight:var(--fw-semi);margin-top:6px;word-break:break-word;}
.fl-meta{font-size:var(--fs-sm);color:var(--muted);margin-top:4px;word-break:break-word;}
.fl-body{padding:0 14px 14px;font-size:var(--fs-md);line-height:1.5;}
.fl-body p{margin-top:8px;word-break:break-word;}
.fl-body pre{white-space:pre-wrap;word-break:break-all;font-size:var(--fs-sm);background:rgba(127,127,127,0.08);border-radius:var(--r-sm);padding:10px;margin-top:8px;}
.fl-body a{color:var(--text);font-weight:var(--fw-bold);}
.fl-quote{border-left:3px solid var(--accent);padding-left:10px;}
.fl-empty,.fl-state{font-size:var(--fs-md);color:var(--muted);text-align:center;padding:28px 12px;line-height:1.5;}
.fl-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:var(--r-md);border:1px solid var(--hairline);background:var(--card-bg);color:var(--text);font:inherit;font-weight:var(--fw-bold);text-decoration:none;margin-top:12px;cursor:pointer;}
@media (max-width:360px){.fl-counts{grid-template-columns:repeat(2,1fr);}}

<body>
<div class="fl-wrap">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  </a>
  <h1 class="fl-title">Field log</h1>
  <p class="fl-sub">Every problem report and crash type, newest first. To change a status, use its GitHub issue: add <b>in-progress</b> or <b>needs-decision</b>, or close it.</p>
  <div id="flApp"><div class="fl-state" role="status">Loading…</div></div>
</div>

<script src="mc-supabase.js"></script>
<script>
(function () {
  'use strict';
  var REPO = 'https://github.com/mcross2298/4-Weeks-to-Open-';
  var app = document.getElementById('flApp');
  var CAT = { bug: 'Something broke', friction: 'Hard to use', idea: 'Idea' };
  var SEV = { blocker: 'Stopped me', annoying: 'Slowed me down', minor: 'Minor' };
  var LABEL = { 'new': 'New', filed: 'Open', fixing: 'In progress', needs_decision: 'Needs decision',
    fixed: 'Fixed', wontfix: "Won't fix", duplicate: 'Duplicate' };
  var GROUP = { 'new': 'open', filed: 'open', fixing: 'progress', needs_decision: 'decision',
    fixed: 'closed', wontfix: 'closed', duplicate: 'closed' };
  var FILTERS = [['all', 'All'], ['open', 'Open'], ['progress', 'In progress'], ['decision', 'Needs decision'], ['closed', 'Closed']];
  var filter = 'all', items = [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function when(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
    catch (e) { return String(iso); }
  }
  function state(html) { app.innerHTML = '<div class="fl-state" role="status">' + html + '</div>'; }

  function load(c) {
    return Promise.all([
      c.from('client_reports')
        .select('id, created_at, category, severity, message, page, workout_page, program, build, platform, status, issue_number, resolved_at')
        .order('created_at', { ascending: false }).limit(300),
      c.from('client_error_issues').select('fingerprint, issue_number, reported_count, status, last_seen, filed_at, resolved_at'),
      c.from('client_errors').select('fingerprint, kind, message, stack, source, line, page, platform, occurred_at')
        .order('occurred_at', { ascending: false }).limit(2000)
    ]).then(function (r) {
      var err = r.filter(function (x) { return x && x.error; })[0];
      if (err) throw err.error;
      var reports = (r[0].data || []).map(function (x) {
        return { kind: 'report', at: x.created_at, status: x.status, issue: x.issue_number, row: x };
      });
      var filed = {};
      (r[1].data || []).forEach(function (x) { filed[x.fingerprint] = x; });
      var groups = {};
      (r[2].data || []).forEach(function (e) {
        var g = groups[e.fingerprint];
        if (!g) groups[e.fingerprint] = g = { sample: e, count: 0, pages: {}, first: e.occurred_at, last: e.occurred_at };
        g.count++;
        if (e.page) g.pages[e.page] = 1;
        if (e.occurred_at < g.first) g.first = e.occurred_at;
      });
      var crashes = Object.keys(groups).map(function (fp) {
        var g = groups[fp], f = filed[fp];
        return { kind: 'crash', at: g.last, status: f ? (f.status || (f.resolved_at ? 'fixed' : 'filed')) : 'new',
          issue: f ? f.issue_number : null, fp: fp, g: g };
      });
      items = reports.concat(crashes).sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
      render();
    });
  }

  function itemHtml(it) {
    var st = it.status || 'new';
    var issue = it.issue ? '<a href="' + REPO + '/issues/' + it.issue + '" target="_blank" rel="noopener">Issue #' + it.issue + ' on GitHub</a>'
      : 'No GitHub issue yet — the hourly sync files it.';
    var head = '<div class="fl-head"><span class="fl-kind">' + (it.kind === 'report' ? 'Report' : 'Crash') + '</span>' +
      '<span class="fl-pill st-' + esc(st) + '">' + esc(LABEL[st] || st) + '</span>' +
      '<span>' + esc(when(it.at)) + '</span>' + (it.issue ? '<span>#' + it.issue + '</span>' : '') + '</div>';
    if (it.kind === 'report') {
      var x = it.row;
      return '<details class="fl-item"><summary>' + head +
        '<div class="fl-what">' + esc(CAT[x.category] || x.category) + ' · ' + esc(SEV[x.severity] || x.severity) + '</div>' +
        '<div class="fl-meta">' + esc(x.workout_page || x.page || '') + (x.platform ? ' · ' + esc(x.platform) : '') + '</div></summary>' +
        '<div class="fl-body"><p class="fl-quote">' + esc(x.message) + '</p>' +
        '<p class="fl-meta">From ' + esc(x.page || '—') + (x.program ? ' · program ' + esc(x.program) : '') +
          (x.build ? ' · ' + esc(x.build) : '') + ' · report #' + x.id +
          (x.resolved_at ? ' · closed ' + esc(when(x.resolved_at)) : '') + '</p>' +
        '<p>' + issue + '</p></div></details>';
    }
    var s = it.g.sample;
    return '<details class="fl-item"><summary>' + head +
      '<div class="fl-what">' + esc(s.message) + '</div>' +
      '<div class="fl-meta">' + it.g.count + ' time' + (it.g.count === 1 ? '' : 's') +
        (s.source ? ' · ' + esc(s.source) + (s.line ? ':' + s.line : '') : '') + '</div></summary>' +
      '<div class="fl-body"><p class="fl-meta">' + esc(s.kind) + ' · pages: ' + esc(Object.keys(it.g.pages).join(', ') || '—') +
        ' · first ' + esc(when(it.g.first)) + ' · last ' + esc(when(it.g.last)) + ' · ' + esc(it.fp) + '</p>' +
        (s.stack ? '<pre>' + esc(s.stack) + '</pre>' : '') + '<p>' + issue + '</p></div></details>';
  }

  function render() {
    var n = { open: 0, progress: 0, decision: 0, closed: 0 };
    items.forEach(function (it) { n[GROUP[it.status] || 'open']++; });
    var shown = items.filter(function (it) { return filter === 'all' || (GROUP[it.status] || 'open') === filter; });
    app.innerHTML =
      '<div class="fl-counts">' +
        '<div class="fl-count"><b>' + n.open + '</b><span>Open</span></div>' +
        '<div class="fl-count"><b>' + n.progress + '</b><span>In progress</span></div>' +
        '<div class="fl-count"><b>' + n.decision + '</b><span>Needs decision</span></div>' +
        '<div class="fl-count"><b>' + n.closed + '</b><span>Closed</span></div></div>' +
      '<div class="fl-chips" role="group" aria-label="Filter by status">' + FILTERS.map(function (f) {
        return '<button type="button" class="fl-chip" data-f="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + '</button>';
      }).join('') + '</div>' +
      '<div class="fl-list">' + (shown.length ? shown.map(itemHtml).join('')
        : '<div class="fl-empty">' + (items.length ? 'Nothing with this status.' : 'No reports or crashes yet.') + '</div>') + '</div>';
  }

  app.addEventListener('click', function (e) {
    var chip = e.target.closest('.fl-chip');
    if (!chip) return;
    filter = chip.getAttribute('data-f');
    render();
  });

  var SB = window.MC_SB;
  if (!SB || !SB.configured) { state('The backend is not configured on this build.'); return; }
  if ('onLine' in navigator && !navigator.onLine) { state('You are offline. The Field log reads live data, so it needs a connection.'); return; }
  SB.currentUser().then(function (u) {
    if (!u) { state('Sign in with the owner account to see the Field log.<br><a class="fl-btn" href="dashboard.html">Go to Home</a>'); return null; }
    return SB.isOwner().then(function (owner) {
      if (!owner) { state('The Field log is for the app owner only.'); return null; }
      return load(SB.client);
    });
  }).catch(function (err) {
    state('Could not load the Field log: ' + esc((err && err.message) || err) + '<br><button type="button" class="fl-btn" onclick="location.reload()">Try again</button>');
  });
})();
</script>
