<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1E2022" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#F7F5F1" media="(prefers-color-scheme: light)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mike's Cookbook" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="images/icons/icon-180.png" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>The whole tour · Mike's Cookbook</title>
<link rel="stylesheet" href="cookbook.css" />
<link rel="stylesheet" href="quick-tour.css" />
<style>
/* ── The tour as one document. Everything a slide contains is already styled
      by quick-tour.css; the only thing this page adds is the shape AROUND a
      slide — stacked sections with a contents list on top, instead of one
      positioned card at a time. ── */
.qtf-intro{padding:4px 16px 10px;}
.qtf-intro p{font-size:14px;line-height:1.55;color:var(--on-dark-dim);}
/* A real target, not a link inside a sentence: tools/check-a11y.mjs measures
   every anchor against the 44px floor and has no inline-link exemption, and
   this one is a genuine destination rather than an aside. */
.qtf-guided{display:flex;align-items:center;min-height:44px;margin-top:10px;padding:8px 12px;
  border-radius:12px;background:var(--bg-elev);border:1px solid var(--line-dark);
  color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;}
.qtf-toc{margin:6px 16px 20px;padding:14px;border-radius:14px;background:var(--bg-elev);border:1px solid var(--line-dark);}
.qtf-toc h2{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--on-dark);margin-bottom:8px;}
.qtf-toc ol{list-style:none;counter-reset:qtf;}
.qtf-toc li{counter-increment:qtf;}
.qtf-toc a{display:flex;align-items:center;gap:10px;min-height:44px;padding:2px 4px;text-decoration:none;
  color:var(--on-dark);font-size:14px;border-bottom:1px solid var(--line-dark);}
.qtf-toc li:last-child a{border-bottom:0;}
.qtf-toc a::before{content:counter(qtf);flex-shrink:0;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;
  font-size:11px;font-weight:800;}
.qtf-toc .qtf-eyebrow{color:var(--on-dark-dim);font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;}
.qtf-sec{padding:8px 16px 4px;
  /* The top bar is sticky, so a bare anchor jump parks the section title
     underneath it. Clear its real height plus the notch. */
  scroll-margin-top:calc(82px + env(safe-area-inset-top));}
.qtf-sec + .qtf-sec{border-top:1px solid var(--line-dark);margin-top:22px;padding-top:24px;}
/* quick-tour.css hides every slide but the active one (display:none / .active
   display:block) — that is the step tour's whole mechanism. Here every slide is
   shown, so the rule has to be undone explicitly, and the entrance animation
   with it: twelve of them firing at once on load is not an entrance. */
.qtf-sec .qt-slide{display:block;animation:none;padding:0;}
.qtf-top-actions{display:flex;gap:10px;padding:0 16px 18px;flex-wrap:wrap;}
.qtf-top-actions a{flex:1 1 160px;min-height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:12px;text-decoration:none;font-size:13px;font-weight:700;}
.qtf-top-actions .primary{background:var(--accent);color:#fff;}
.qtf-top-actions .ghost{background:var(--bg-elev);border:1px solid var(--line-dark);color:var(--on-dark);}
/* quick-tour.css sizes .qt-back at 38px and .qt-skip's tap area at 34px tall.
   Both are pre-existing shortfalls on the step tour (tools/check-a11y.mjs
   records them in its ratchet); this page is new, so it starts at the floor
   rather than inheriting a miss. Scoped here so the step tour's own layout,
   which the ratchet is measured against, is untouched. */
.qt-top .qt-back{width:44px;height:44px;}
.qt-top .qt-skip{display:flex;align-items:center;min-height:44px;padding:8px 10px;}
</style>
</head>
<body>

<!-- One step at a time is the right shape for a first open and the wrong one
     for looking something up later: nothing to scan, nothing to search, nothing
     to send someone. This is the same quick-tour-data.js the step tour renders,
     laid out as a single document, so the two cannot say different things. -->
<div class="qt-top">
  <a href="quick-tour.html" class="qt-back" aria-label="Back to the step-by-step tour">←</a>
  <div class="qt-top-info">
    <div class="qt-top-title">The whole tour</div>
    <div class="qt-top-sub" id="qtfSub">Every step, one page</div>
  </div>
  <a href="index.html" class="qt-skip">Home</a>
</div>

<div class="qtf-intro">
  <p>Every step of the Quick Tour, in order, on one scrollable page — for looking
     something up rather than being walked through it.</p>
  <a class="qtf-guided" href="quick-tour.html">🎬 Prefer the guided version? Take the step-by-step tour →</a>
</div>

<nav class="qtf-toc" aria-label="Contents">
  <h2>Contents</h2>
  <ol id="qtfToc"></ol>
</nav>

<div id="qtfSections"></div>

<div class="qtf-top-actions">
  <a class="primary" href="index.html">Start cooking →</a>
  <a class="ghost" href="quick-tour-overview.html">Executive Summary</a>
</div>

<script src="quick-tour-data.js"></script>
<script>
(function () {
  'use strict';
  var slides = (window.MC_TOUR && MC_TOUR.SLIDES) || [];

  document.getElementById('qtfSub').textContent =
    slides.length + ' steps, one page';

  document.getElementById('qtfToc').innerHTML = slides.map(function (s, i) {
    return '<li><a href="#qtf-' + i + '">' +
      '<span><span class="qtf-eyebrow">' + s.eyebrow + '</span><br>' + s.title + '</span></a></li>';
  }).join('');

  document.getElementById('qtfSections').innerHTML = slides.map(function (s, i) {
    return '<section class="qtf-sec" id="qtf-' + i + '">' +
      '<div class="qt-slide">' + MC_TOUR.slideBodyHTML(s) + '</div></section>';
  }).join('');
})();
</script>
<script src="cookbook-sw.js"></script>
</body>
</html>
