<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #1e1e1e;
    --text: #e5e5e5;
    --muted: #6b7280;
    --accent: #d4af37;
    --accent-dim: rgba(212,175,55,0.12);
    --accent-glow: rgba(212,175,55,0.25);
    --crimson: #dc2626;
    --emerald: #10b981;
    --amber: #f59e0b;
    --purple: #8b5cf6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  .page-wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* ── Back Nav ── */
  .back-nav {
    padding: 16px 0 0;
  }
  .back-nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .back-nav a:hover { color: var(--accent); }

  /* ── Program Header ── */
  .program-header {
    margin-top: 20px;
    padding: 24px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: 12px;
  }

  .program-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .program-header h1 {
    font-size: clamp(22px, 5vw, 28px);
    font-weight: 800;
    line-height: 1.15;
    color: #fff;
    margin-bottom: 10px;
  }

  .program-tagline {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 18px;
  }

  .program-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }

  .meta-badge {
    background: var(--accent-dim);
    border: 1px solid var(--accent-glow);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.03em;
  }

  .designer-credit {
    font-size: 12px;
    color: var(--muted);
  }

  .guide-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-dim);
    border: 1px solid var(--accent-glow);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 8px;
    text-decoration: none;
    margin-top: 16px;
    transition: background 0.15s;
  }
  .guide-link:hover { background: rgba(212,175,55,0.2); }

  /* ── Section Title ── */
  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 28px 0 12px;
  }

  /* ── Split Cards ── */
  .split-card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 18px;
    margin-bottom: 10px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }

  .split-card:hover {
    background: #161616;
  }

  .split-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
  }

  .split-gold::before   { background: #d4af37; }
  .split-crimson::before { background: #dc2626; }
  .split-emerald::before { background: #10b981; }
  .split-amber::before  { background: #f59e0b; }
  .split-purple::before { background: #8b5cf6; }
  .split-cardio::before { background: #06b6d4; }

  .split-card:hover.split-gold   { border-color: rgba(212,175,55,0.35); }
  .split-card:hover.split-crimson { border-color: rgba(220,38,38,0.35); }
  .split-card:hover.split-emerald { border-color: rgba(16,185,129,0.35); }
  .split-card:hover.split-amber  { border-color: rgba(245,158,11,0.35); }
  .split-card:hover.split-purple { border-color: rgba(139,92,246,0.35); }
  .split-card:hover.split-cardio { border-color: rgba(6,182,212,0.35); }

  .split-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .split-label {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .split-emoji {
    font-size: 18px;
    line-height: 1;
  }

  .split-name {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
  }

  .split-subtitle {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-top: 1px;
  }

  .split-arrow {
    color: var(--muted);
    font-size: 16px;
    margin-top: 2px;
    flex-shrink: 0;
  }

  .split-days {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    padding-left: 26px;
  }

  .split-count {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
    padding-left: 26px;
  }

  /* ── Bottom Back ── */
  .bottom-back {
    margin-top: 28px;
    text-align: center;
  }
  .bottom-back a {
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
  }
  .bottom-back a:hover { color: var(--accent); }

  /* ── SAND LIGHT MODE (Phase 7) ─────────────────────────────────────── */
  html[data-theme="light"] {
    --bg: #f5f2ec;
    --surface: #efe9db;
    --border: rgba(28,26,23,0.12);
    --text: #1c1a17;
    --muted: #6b6459;
    --accent-dim: rgba(212,175,55,0.16);
    --accent-glow: rgba(212,175,55,0.32);
  }
  html[data-theme="light"] .program-header h1 { color: #1c1a17; }
  html[data-theme="light"] .split-name { color: #1c1a17; }
  html[data-theme="light"] .split-card:hover { background: #e9e2d0; }

/* F1b — Overview | Program list. No `def` is passed: this program has no

  var DAYS = {
    'mc-split1': { title: 'Split 1 \u2014 Gold',            icon: '\u{1F49B}',         meta: 'The 7-Day Week \u00B7 5 workouts + cardio' },

    'mc-cardio': { title: 'Cardio Plan',                     icon: '\u{1F3C3}',         meta: 'All splits \u00B7 post-workout + cardio day' }

  var CFG = {

    programName: p.name || "Mike Cross' Favorite Splits",
    desc: p.desc || '', forWho: p.forWho || '',
    guide: { href: 'mc-instructions.html', label: 'Favorite Splits guide' },

      days: ['mc-split1','mc-split2','mc-split3','mc-split4','mc-split5','mc-cardio'] }],
    dayMeta: function (id) { return DAYS[id] || null; },
    onOpen: function (id) { if (DAYS[id]) location.href = id + '.html'; }

  if (!window.MC_PROGRAM_TABS) return;
  MC_PROGRAM_TABS.mount(document.getElementById('progTabs'), CFG);
})();
