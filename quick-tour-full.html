<style>
/* ── The tour as one document. Everything inside a slide is already styled by
      quick-tour.css; all this adds is the shape AROUND a slide — stacked
      sections with a contents list on top, instead of one card at a time. ── */
.qtf-intro{max-width:560px;margin:0 auto;padding:4px 16px 10px;}
.qtf-intro p{font-size:var(--fs-md);line-height:1.55;color:var(--muted);}
.qtf-guided{display:flex;align-items:center;min-height:44px;margin-top:10px;padding:8px 12px;
  border-radius:var(--r-md);background:var(--surface-1,rgba(255,255,255,0.04));
  border:1px solid var(--line,rgba(255,255,255,0.1));
  color:var(--gold);font-size:var(--fs-sm);font-weight:700;text-decoration:none;}
.qtf-toc{max-width:560px;margin:6px auto 20px;padding:0 16px;}
.qtf-toc-inner{padding:14px;border-radius:var(--r-lg);
  background:var(--surface-1,rgba(255,255,255,0.04));border:1px solid var(--line,rgba(255,255,255,0.1));}
.qtf-toc h2{font-size:var(--fs-lg);font-weight:800;margin-bottom:8px;color:var(--text);}
.qtf-toc ol{list-style:none;counter-reset:qtf;margin:0;padding:0;}
.qtf-toc li{counter-increment:qtf;}
.qtf-toc a{display:flex;align-items:center;gap:10px;min-height:44px;padding:2px 4px;
  text-decoration:none;color:var(--text);font-size:var(--fs-sm);
  border-bottom:1px solid var(--line,rgba(255,255,255,0.08));}
.qtf-toc li:last-child a{border-bottom:0;}
.qtf-toc a::before{content:counter(qtf);flex-shrink:0;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:var(--gold);color:#0a0a0a;
  font-size:var(--fs-2xs);font-weight:800;}
.qtf-eyebrow{color:var(--muted);font-size:var(--fs-2xs);font-weight:700;letter-spacing:0.04em;text-transform:uppercase;}
.qtf-sec{max-width:560px;margin:0 auto;padding:8px 16px 4px;
  /* The topbar is sticky, so a bare anchor jump parks the section title
     underneath it. Clear its real height plus the notch. */
  scroll-margin-top:calc(78px + env(safe-area-inset-top));}
.qtf-sec + .qtf-sec{border-top:1px solid var(--line,rgba(255,255,255,0.08));margin-top:22px;padding-top:24px;}
/* quick-tour.css hides every slide but the active one (display:none / .active
   display:block) — that is the step tour's whole mechanism. Here every slide is
   shown, so the rule has to be undone explicitly, and the entrance animation
   with it: eighteen of them firing at once on load is not an entrance. */
.qtf-sec .slide{display:block;animation:none;}
.qtf-actions{max-width:560px;margin:0 auto;display:flex;gap:10px;padding:18px 16px calc(28px + env(safe-area-inset-bottom));flex-wrap:wrap;}
.qtf-actions a{flex:1 1 160px;min-height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--r-md);text-decoration:none;font-size:var(--fs-sm);font-weight:700;}
.qtf-actions .primary{background:var(--gold);color:#0a0a0a;}
.qtf-actions .ghost{background:var(--surface-1,rgba(255,255,255,0.04));
  border:1px solid var(--line,rgba(255,255,255,0.1));color:var(--text);}
/* base.css sizes .back at 38px and .skip's tap area under the floor. Both are
   pre-existing shortfalls on the pages that carry them; this page is new, so it
   starts at 44 rather than inheriting a miss. Scoped here only. */
.topbar .back{width:44px;height:44px;}
.topbar .skip{display:flex;align-items:center;min-height:44px;padding:8px 10px;}
</style>

<body>

<!-- One step at a time is the right shape for a first open and the wrong one
     for looking something up later: nothing to scan, nothing to search, nothing
     to send someone. This renders the same quick-tour-data.js the step tour
     does, laid out as a single document, so the two cannot say different
     things. -->
<div class="topbar">
  <a href="quick-tour.html" class="back" aria-label="Back to the step-by-step tour">←</a>
  <div class="topbar-info">
    <div class="topbar-title">The whole tour</div>
    <div class="topbar-sub" id="qtfSub">Every step, one page</div>
  </div>
  <a href="dashboard.html" class="skip">Dashboard</a>
</div>

<div class="qtf-intro">
  <p>Every step of the Quick Tour, in order, on one scrollable page — for looking
     something up rather than being walked through it.</p>
  <a class="qtf-guided" href="quick-tour.html">🎬 Prefer the guided version? Take the step-by-step tour →</a>
</div>

<nav class="qtf-toc" aria-label="Contents">
  <div class="qtf-toc-inner">
    <h2>Contents</h2>
    <ol id="qtfToc"></ol>
  </div>
</nav>

<div id="qtfSections"></div>

<div class="qtf-actions">
  <a class="primary" href="dashboard.html">Go to the Dashboard →</a>
  <a class="ghost" href="quick-tour-overview.html">Executive Summary</a>
</div>

<script src="quick-tour-data.js"></script>
<script>
(function () {
  'use strict';
  var slides = (window.MC_TOUR && MC_TOUR.SLIDES) || [];

  document.getElementById('qtfSub').textContent = slides.length + ' steps, one page';

  document.getElementById('qtfToc').innerHTML = slides.map(function (s, i) {
    return '<li><a href="#qtf-' + i + '">' +
      '<span><span class="qtf-eyebrow">' + s.eyebrow + '</span><br>' + s.title + '</span></a></li>';
  }).join('');

  document.getElementById('qtfSections').innerHTML = slides.map(function (s, i) {
    return '<section class="qtf-sec" id="qtf-' + i + '">' +
      '<div class="slide">' + MC_TOUR.slideBodyHTML(s) + '</div></section>';
  }).join('');
})();
</script>
<script src="mc-sw-update.js"></script>
</body>
